map $uri $coffee_fly_cache_control {
  default "";
  /index.html "no-store";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=30s ipv6=off;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; worker-src 'self' blob:; child-src blob:; manifest-src 'self'; form-action 'self'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Cache-Control $coffee_fly_cache_control always;

  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;
  }

  location = /health {
    proxy_pass http://backend:8000/health/ready;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
  }

  location /osrm/ {
    set $osrm_upstream http://osrm:5000;
    rewrite ^/osrm/(.*)$ /$1 break;
    proxy_pass $osrm_upstream;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    limit_except GET { deny all; }
  }

  location = /index.html { }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
