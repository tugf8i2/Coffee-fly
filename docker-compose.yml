name: coffee-fly

services:
  db:
    image: postgres:16.15-alpine3.24
    shm_size: 128mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coffeefly}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
    ports:
      # El 5432 del equipo ya lo usa otra instalación de PostgreSQL.
      # Solo el puerto del PC cambia; entre contenedores se usa el estándar 5432.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Inicializar la base con el script SQL si no existe
      - ./backend/BaseDatos.sql:/docker-entrypoint-initdb.d/BaseDatos.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: coffee-fly-backend:1.0.0
    build:
      context: ./backend
      pull: true
    working_dir: /app
    command: sh -c "PYTHONPATH=/app alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    environment:
      ENV: ${ENV:-development}
      # Credenciales del registrador inicial (solo se usa si la BD no tiene registradores).
      BOOTSTRAP_REGISTRADOR_EMAIL: ${BOOTSTRAP_REGISTRADOR_EMAIL:-admin@coffeefly.com}
      BOOTSTRAP_REGISTRADOR_PASSWORD: ${BOOTSTRAP_REGISTRADOR_PASSWORD:-Admin123}
      # Valores listos para desarrollo local; producción debe sobrescribirlos en .env.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-coffee-fly-development-only-jwt-secret-2026-change-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-1234}@db:5432/${POSTGRES_DB:-coffeefly}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  frontend:
    image: coffee-fly-frontend:1.0.0
    build:
      context: ./frontend
      pull: true
      args:
        # /api usa el mismo host del navegador y Nginx lo dirige a FastAPI.
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-/api}
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health | grep -q ready"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  postgres_data:
