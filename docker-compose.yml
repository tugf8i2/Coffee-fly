services:
  db:
    image: postgres:16-alpine
    command: ["postgres", "-p", "5433"]
    environment:
      # Nombre de la BD usado localmente: 'coffeefly'
      POSTGRES_DB: coffeefly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    ports:
      # El 5432 del equipo ya lo usa otra instalación de PostgreSQL.
      # PostgreSQL usa 5433 tanto dentro como fuera de Docker.
      # Puedes cambiarlo sin tocar este archivo con POSTGRES_HOST_PORT.
      - "${POSTGRES_HOST_PORT:-5433}:5433"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Inicializar la base con el script SQL si no existe
      - ./backend/BaseDatos.sql:/docker-entrypoint-initdb.d/BaseDatos.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coffeefly -p 5433"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    working_dir: /app
    command: sh -c "PYTHONPATH=/app alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    environment:
      ENV: development
      # Credenciales del registrador inicial (solo se usa si la BD no tiene registradores).
      BOOTSTRAP_REGISTRADOR_EMAIL: ${BOOTSTRAP_REGISTRADOR_EMAIL:-}
      BOOTSTRAP_REGISTRADOR_PASSWORD: ${BOOTSTRAP_REGISTRADOR_PASSWORD:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY es obligatoria}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      # Asegurarse de usar el mismo nombre de BD: 'coffeefly'
      DATABASE_URL: postgresql://postgres:1234@db:5433/coffeefly
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
          # Para que el navegador que carga los archivos estáticos pueda alcanzar el backend
          EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
