services:
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:3.8.3
    environment:
      tile_urls: https://download.geofabrik.de/south-america/colombia-260901.osm.pbf
      server_threads: ${VALHALLA_THREADS:-4}
      build_admins: "True"
      build_time_zones: "True"
      build_elevation: "False"
      build_tar: "True"
      serve_tiles: "True"
    ports:
      - "127.0.0.1:${VALHALLA_HOST_PORT:-8002}:8002"
    volumes:
      - valhalla_data:/custom_files
    init: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8002/status"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 20m
    restart: unless-stopped

  backend:
    environment:
      ROUTING_PROVIDER: valhalla
      ROUTING_URL: http://valhalla:8002
    depends_on:
      valhalla:
        condition: service_healthy

volumes:
  valhalla_data:
