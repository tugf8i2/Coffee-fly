services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v26.9.0-debian@sha256:8a1b1bc938412f15f9b5b32d794c4ec6bf4a85dfbbabfa0a014b70b187edb53b
    command: ["osrm-routed", "--algorithm", "mld", "--threads", "${OSRM_THREADS:-4}", "/data/colombia.osrm"]
    ports:
      - "127.0.0.1:${OSRM_HOST_PORT:-5000}:5000"
    volumes:
      - osrm_data:/data:ro
    read_only: true
    init: true
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5000; printf 'GET /nearest/v1/driving/-74.0721,4.7110 HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; timeout 5 grep -q '\"code\":\"Ok\"' <&3"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    stop_grace_period: 30s

  frontend:
    build:
      args:
        EXPO_PUBLIC_OSRM_URL: /osrm
    depends_on:
      osrm:
        condition: service_healthy

  backend:
    environment:
      ROUTING_PROVIDER: osrm
      ROUTING_URL: http://osrm:5000
    depends_on:
      osrm:
        condition: service_healthy

volumes:
  osrm_data:
    external: true
    name: coffee-fly_osrm_data
